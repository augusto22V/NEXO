<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ALPX | Editoriales y distribuidoras</title>

  <link rel="stylesheet" href="../../compartido/css/base.css?v=2026.04.18.03" />
  <link rel="stylesheet" href="../../compartido/css/panelAuditoria.css?v=2026.04.18.03" />
  <link rel="stylesheet" href="proveedores.css?v=2026.04.18.03" />
</head>

<body>

<header class="topbar">
 <button class="btn-volver" onclick="volverSeguro()">← Volver</button>

  <div class="titulo">
  <span id="moduloTitulo">Editoriales y distribuidoras</span>
  </div>
</header>

<main class="admin-container">

  <!-- PANEL IZQUIERDO -->
  <section class="panel panel-form">
    <h2>Proveedor (editorial / distribuidora)</h2>

    <form autocomplete="off" onsubmit="return false;">

      <input type="hidden" id="proveedorId">

      <label>Código</label>
      <input type="text" id="codigoProveedor" inputmode="numeric" pattern="[0-9]*" maxlength="10">

      <label>Nombre *</label>
      <input type="text" id="nombreProveedor" required maxlength="120">

      <label>Razón social</label>
      <input type="text" id="razonProveedor" maxlength="150">

      <label>RUC</label>
      <input type="text" id="rucProveedor" maxlength="20" inputmode="numeric">

      <label>Teléfono</label>
      <input type="text" id="telefonoProveedor" maxlength="20" inputmode="numeric">

      <label>Dirección</label>
      <input type="text" id="direccionProveedor" maxlength="200">

      <label>Email</label>
      <input type="email" id="emailProveedor" value="sincorreo@gmail.com" maxlength="120">

     <label class="switch">
    <input type="checkbox" id="activoProveedor" checked>
    <span class="slider"></span>
    </label>
    <span>Activo</span>

    </form>
    <panel-auditoria id="auditProveedor" data-tabla="proveedor" data-id-input="proveedorId"></panel-auditoria>
    <!-- ACCIONES -->
    <div class="acciones">
      <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
        <img src="../../recursos/img/nueva.png" />
        <span>Nuevo</span>
        <small>F2</small>
      </button>

      <button type="button" id="btnGuardar" onclick="guardar()" title="Guardar" disabled>
        <img src="../../recursos/img/guardar.png" />
        <span>Guardar</span>
        <small>F3</small>
      </button>

      <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
        <img src="../../recursos/img/limpiar.png" />
        <span>Eliminar</span>
        <small>Del</small>
      </button>

      <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
        <img src="../../recursos/img/cancelar.png" />
        <span>Cancelar</span>
        <small>F4</small>
      </button>

      <button type="button" id="btnSeleccionar" onclick="seleccionarProveedor()" title="Seleccionar" style="display:none;">
        <img src="../../recursos/img/buscar.png" />
        <span>Seleccionar</span>
        <small>Enter</small>
      </button>
    </div>

  </section>

  <!-- PANEL DERECHO -->
  <section class="panel panel-lista">

    <input
      type="text"
      id="buscar"
      placeholder="Buscar proveedor por nombre, RUC o teléfono..."
      class="buscador"
      autocomplete="off"
      onkeyup="filtrar()"
    />

    <p id="avisoTabla" class="aviso-tabla hidden">
      Finalice la carga o cancele para seleccionar otro proveedor
    </p>

    <div class="tabla-proveedores">

      <div class="tabla-header">
         <span id="thId" class="th-orden" title="Ordenar por ID">ID ▼</span>
        <span>Nombre</span>
        <span>RUC</span>
        <span>Teléfono</span>
        <span>Dirección</span>
        <span>Email</span>
       <span>Estado</span>
      </div>

      <div id="tablaProveedores" class="tabla-body"></div>

    </div>

  </section>

</main>

<!-- MODAL CONFIRMAR ELIMINACIÓN -->
<div id="modalEliminar" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Confirmar eliminación</h3>

    <p class="modal-text">
      ¿Desea eliminar el proveedor?
    </p>

    <p class="modal-nombre" id="modalNombreProveedor"></p>

    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
      <button class="btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL ADVERTENCIA -->
<div id="modalAdvertencia" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Atención</h3>

    <p class="modal-text" id="modalAdvertenciaTexto"></p>

    <div class="modal-actions center">
      <button class="btn-aceptar" onclick="cerrarAdvertencia(true)">Aceptar</button>
    </div>
  </div>
</div>



<script src="../../compartido/js/baseModal.js?v=2026.04.18.03"></script>
<script src="../../compartido/js/panelAuditoria.js?v=2026.04.18.03"></script>
<script src="proveedores.js?v=2026.04.18.03"></script>
<script src="/compartido/js/seguridad.js?v=2026.04.18.03"></script>

</body>
</html>
