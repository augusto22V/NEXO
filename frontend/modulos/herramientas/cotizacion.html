<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALPX | Cotizacion</title>

  <link rel="stylesheet" href="/compartido/css/base.css">
  <link rel="stylesheet" href="/compartido/css/panelAuditoria.css">
  <link rel="stylesheet" href="/modulos/herramientas/cotizacion.css?v=2026.04.18.08">
</head>
<body>
  <header class="topbar">
    <button class="btn-volver" type="button" onclick="volverSeguro()">&#8592; Volver</button>
    <div class="titulo">
      <span id="moduloTitulo">Cotizacion de Monedas</span>
    </div>
  </header>

  <main>
    <section class="cotizacion-container">
      <input type="hidden" id="cotizacionIdActual">

      <div class="head">
        <h1>Cotizacion Operativa</h1>
        <p>Gestion simple para Guarani, Real y Dolar.</p>
      </div>

      <div id="estadoCotizacion" class="estado" aria-live="polite"></div>

      <section class="panel panel-base">
        <h2>Moneda Base por Empresa</h2>
        <div class="base-grid">
          <div class="campo">
            <label>Empresa actual</label>
            <div id="empresaActual" class="valor-fijo">-</div>
          </div>
          <div class="campo">
            <label>Moneda base activa</label>
            <div id="monedaBaseActual" class="badge-base">-</div>
          </div>
          <div class="campo">
            <label for="monedaBaseSelect">Cambiar moneda base</label>
            <select id="monedaBaseSelect">
              <option value="1">1 - Guarani</option>
              <option value="2">2 - Real</option>
              <option value="3">3 - Dolar</option>
            </select>
          </div>
          <div class="campo campo-btn">
            <button id="btnGuardarMonedaBase" type="button" class="btn-secundario">Guardar Moneda Base</button>
          </div>
        </div>
      </section>

      <section class="panel panel-vigente">
        <h2>Cotizacion Vigente</h2>
        <ul id="resumenCotizacion" class="resumen-lista"></ul>
      </section>

      <section class="panel panel-edicion">
        <h2>Actualizar Cotizacion</h2>
        <p class="hint" id="hintEdicion">
          Ingrese los valores segun la moneda base activa.
        </p>
        <div class="campos-grid">
          <div class="campo">
            <label id="labelCampoA" for="campoA">-</label>
            <input id="campoA" type="number" step="0.000001" min="0">
          </div>
          <div class="campo">
            <label id="labelCampoB" for="campoB">-</label>
            <input id="campoB" type="number" step="0.000001" min="0">
          </div>
        </div>
        <button id="btnGuardarCotizacion" type="button" class="btn-principal">Guardar Cotizacion</button>
      </section>

      <panel-auditoria data-tabla="cotizacion" data-id-input="cotizacionIdActual"></panel-auditoria>
    </section>
  </main>

  <script src="/compartido/js/baseModal.js"></script>
  <script src="/compartido/js/panelAuditoria.js"></script>
  <script src="/modulos/herramientas/cotizacion.js?v=2026.04.18.08"></script>
  <script src="/compartido/js/seguridad.js"></script>
</body>
</html>
