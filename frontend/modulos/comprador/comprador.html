<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
  <title>LibreríaSys | Comprador</title>

  <link rel="stylesheet" href="../../compartido/css/base.css?v=2026.04.18.03">
  <link rel="stylesheet" href="../../compartido/css/panelAuditoria.css?v=2026.04.18.03">
  <link rel="stylesheet" href="comprador.css?v=2026.04.18.03">
</head>
<body>

<header class="topbar">
<button class="btn-volver" onclick="volverSeguro()">← Volver</button>

  <div class="titulo">
    <span id="moduloTitulo">Carga de Comprador</span>
  </div>
</header>

<main class="cliente-layout">

  <!-- ===== FORMULARIO ===== -->
  <section class="panel form-panel">
    <h2>Comprador</h2>

    <input type="hidden" id="compradorId">

        <label>Código</label>
      <input type="text" id="codigoComprador" inputmode="numeric" autocomplete="off">

      <label>Nombre</label>
      <input type="text" id="nombre">

      <label class="check-row">
        <input type="checkbox" id="activo">
        <span>Comprador activo</span>
     </label>

    <panel-auditoria id="auditComprador" data-tabla="comprador" data-id-input="compradorId"></panel-auditoria>
    <div class="acciones">

      <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
        <img src="../../recursos/img/nueva.png">
        <span>Nuevo</span>
        <small>F2</small>
      </button>

      <button type="button" id="btnGuardar" onclick="guardar()" title="Guardar" disabled>
        <img src="../../recursos/img/guardar.png">
        <span>Guardar</span>
        <small>F3</small>
      </button>

      <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
        <img src="../../recursos/img/limpiar.png">
        <span>Eliminar</span>
        <small>Del</small>
      </button>

      <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
        <img src="../../recursos/img/cancelar.png">
        <span>Cancelar</span>
        <small>F4</small>
      </button>

      <button type="button" id="btnSeleccionar" onclick="seleccionarComprador()" title="Seleccionar" style="display:none;">
        <img src="../../recursos/img/buscar.png">
        <span>Seleccionar</span>
        <small>Enter</small>
      </button>

    </div>

  </section>

  <!-- ===== LISTA ===== -->
  <section class="panel lista-panel">

    <input type="text" 
           id="buscarComprador" 
           placeholder="Buscar comprador..."
           onkeyup="filtrar()">

    <div class="detalle-row vacio">
      Seleccione un comprador
    </div>

    <p id="avisoTabla" class="aviso-tabla hidden">
      Finalice la carga o cancele para seleccionar otro comprador
    </p>

    <div class="tabla-clientes">

      <div class="tabla-header">
        <span id="thId">ID ▼</span>
        <span>Nombre</span>
      </div>

      <div id="tablaCompradores" class="tabla-body"></div>

    </div>

  </section>

</main>

<!-- ===== MODAL CONFIRMAR ELIMINACIÓN ===== -->
<div id="modalEliminar" class="modal-overlay hidden">
  <div class="modal-box">

    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Confirmar eliminación</h3>

    <p class="modal-text">
      ¿Desea eliminar el comprador?
    </p>

    <p class="modal-nombre" id="modalNombreComprador"></p>

    <div class="modal-actions">
    <button class="btn-cancelar" type="button">Cancelar</button>
    <button class="btn-eliminar" type="button">Eliminar</button>
    </div>

  </div>
</div>

<!-- ===== MODAL ADVERTENCIA ===== -->
<div id="modalAdvertencia" class="modal-overlay hidden">
  <div class="modal-box">

    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Atención</h3>

    <p class="modal-text" id="modalAdvertenciaTexto"></p>

    <div class="modal-actions center">
      <button class="btn-aceptar" type="button">Aceptar</button>
    </div>

  </div>
</div>

<script src="../../compartido/js/baseModal.js?v=2026.04.18.03"></script>
<script src="../../compartido/js/panelAuditoria.js?v=2026.04.18.03"></script>
<script src="comprador.js?v=2026.04.18.03"></script>
<script src="/compartido/js/seguridad.js?v=2026.04.18.03"></script>

</body>
</html>
