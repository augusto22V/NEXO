<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
  <title>NEXO | Géneros y secciones</title>

  <!-- estilos base del sistema -->
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="../../compartido/css/panelAuditoria.css">

  <!-- estilos específicos del módulo -->
  <link rel="stylesheet" href="categorias.css?v=2026.04.18.02">
</head>

<body>

  <!-- barra superior con navegación -->
  <div class="topbar">

    <!-- botón volver a pantalla anterior -->
    <button class="btn-volver" onclick="volverSeguro()">← Volver</button>

    <!-- título del sistema -->
    <div class="titulo">
      <span id="moduloTitulo">Géneros y secciones de estantería</span>
    </div>

  </div>

  <!-- contenedor principal del módulo -->
  <div class="admin-container">

    <!-- panel izquierdo con formulario -->
    <div class="panel panel-form">

      <h2>Género o sección</h2>

      <!-- formulario de registro -->
      <form id="formCategoria" enctype="multipart/form-data">

        <!-- id interno oculto -->
        <input type="hidden" id="categoriaId">

        <!-- código categoría -->
      <label>Código</label>
<div class="codigo-row">
  <input type="text" id="codigoCategoria">
</div>

        <!-- nombre categoría -->
        <label>Nombre</label>
        <input type="text" id="nombreCategoria" required>

        <!-- orden en pantalla -->
        <label>Orden en pantalla</label>

<div style="display:flex; align-items:center; gap:12px;">
  <input type="text" id="ordenPantalla" inputmode="numeric" pattern="[0-9]*" style="width:100px;">

  <label style="display:flex; align-items:center; gap:6px; margin:0;">
    <input type="checkbox" id="activoCategoria" checked>
    Activa
  </label>

  <label style="display:flex; align-items:center; gap:6px; margin:0;">
    <input type="checkbox" id="mostrarVentaMedioCategoria">
    Mostrar en VentaMedio
  </label>

  <label style="display:flex; align-items:center; gap:6px; margin:0;">
    <input type="checkbox" id="mostrarMenuDigitalCategoria">
    Mostrar en Menú Digital
  </label>
</div>

        <!-- selección imagen -->
        <label>Imagen</label>
        <input type="file" id="imagenCategoria" accept="image/*">

        <!-- vista previa imagen -->
        <div class="preview-box">
          <img id="previewImagen" src="" alt="">
        </div>

        <panel-auditoria id="auditCategoria" data-tabla="categoria" data-id-input="categoriaId"></panel-auditoria>
        <!-- botones de acción -->
        <div class="acciones">

          <!-- crear nuevo -->
          <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
            <img src="../../recursos/img/nueva.png">
            <span>Nuevo</span>
            <small>F2</small>
          </button>

          <!-- guardar -->
          <button type="submit" id="btnGuardar" title="Guardar" disabled>
            <img src="../../recursos/img/guardar.png">
            <span>Guardar</span>
            <small>F3</small>
          </button>

          <!-- eliminar -->
          <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
            <img src="../../recursos/img/limpiar.png">
            <span>Eliminar</span>
            <small>Del</small>
          </button>

          <!-- cancelar -->
          <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
            <img src="../../recursos/img/cancelar.png">
            <span>Cancelar</span>
            <small>F4</small>
          </button>

        </div>

      </form>

    </div>

    <!-- panel derecho con listado -->
    <div class="panel panel-lista">

      <!-- buscador -->
      <input
        type="text"
        id="buscador"
        placeholder=" Buscar categoría..."
        onkeyup="cargarCategorias()"
        class="buscador"
      >

      <!-- tabla categorías -->
      <div class="tabla-categorias">

        <!-- encabezado -->
        <div class="tabla-header">
          <span id="thId" class="th-orden">ID ▼</span>
          <span>Nombre</span>
          <span>Orden en pantalla</span>
        </div>

        <!-- cuerpo tabla -->
        <div id="listaCategorias" class="tabla-body"></div>

      </div>

    </div>

  </div>


<!-- MODAL CONFIRMAR ELIMINACIÓN -->
<div id="modalEliminar" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Confirmar eliminación</h3>

    <p class="modal-text">
      ¿Desea eliminar la categoría?
    </p>

    <p class="modal-nombre" id="modalNombreCategoria"></p>

    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
      <button class="btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL ADVERTENCIA -->
<div id="modalAdvertencia" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Atención</h3>

    <p class="modal-text" id="modalAdvertenciaTexto"></p>

    <div class="modal-actions center">
      <button class="btn-aceptar" onclick="cerrarAdvertencia(true)">Aceptar</button>
    </div>
  </div>
</div>

  <!-- script principal del módulo -->
  <script src="../../compartido/js/baseModal.js"></script>
  <script src="../../compartido/js/panelAuditoria.js"></script>
  <script src="categorias.js?v=2026.04.18.02"></script>
<script src="/compartido/js/seguridad.js"></script>


  <!-- mostrar nombre del módulo en título -->
  <script>
    const paramsTitulo = new URLSearchParams(window.location.search);
    const modoTitulo = paramsTitulo.get("modo");
    if (modoTitulo !== "seleccion") {
      const nombreModulo = document.title.split("|")[1]?.trim();
      if (nombreModulo) {
        document.getElementById("moduloTitulo").textContent = nombreModulo;
      }
    }
  </script>

  <!-- función navegación volver -->
  <script>
    function volver() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get("from");

      if (from === "producto") {
        window.location.href = "productos.html?refreshCategorias=1";
      } else {
        window.location.href = "../../home.html";
      }
    }
  </script>

</body>
</html>
