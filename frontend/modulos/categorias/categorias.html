<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Andy Closet | Categorías</title>

  <!-- estilos base del sistema -->
  <link rel="stylesheet" href="../../compartido/css/base.css">

  <!-- estilos específicos del módulo -->
  <link rel="stylesheet" href="categorias.css">
</head>

<body>

  <!-- barra superior con navegación -->
  <div class="topbar">

    <!-- botón volver a pantalla anterior -->
    <button class="btn-volver" onclick="volver()">← Volver</button>

    <!-- título del sistema -->
    <div class="titulo">
      <h1>Stop Top</h1>
      <span id="moduloTitulo">Gestión</span>
    </div>

  </div>

  <!-- contenedor principal del módulo -->
  <div class="admin-container">

    <!-- panel izquierdo con formulario -->
    <div class="panel panel-form">

      <h2>Categoría</h2>

      <!-- formulario de registro -->
      <form id="formCategoria" enctype="multipart/form-data">

        <!-- id interno oculto -->
        <input type="hidden" id="categoriaId">

        <!-- código categoría -->
        <label>Código</label>
        <input type="text" id="codigoCategoria" inputmode="numeric" pattern="[0-9]*">

        <!-- nombre categoría -->
        <label>Nombre</label>
        <input type="text" id="nombreCategoria" required>

        <!-- orden en pantalla -->
        <label>Orden en pantalla</label>

<div style="display:flex; align-items:center; gap:12px;">
  <input type="text" id="ordenPantalla" inputmode="numeric" pattern="[0-9]*" style="width:100px;">

  <label style="display:flex; align-items:center; gap:6px; margin:0;">
    <input type="checkbox" id="activoCategoria" checked>
    Activa
  </label>
</div>

        <!-- selección imagen -->
        <label>Imagen</label>
        <input type="file" id="imagenCategoria" accept="image/*">

          <label>Estado</label>
          <select id="activoCategoria">
          <option value="true">Activo</option>
        <option value="false">Inactivo</option>
          </select>

        <!-- vista previa imagen -->
        <div class="preview-box">
          <img id="previewImagen" src="" alt="">
        </div>

        <!-- botones de acción -->
        <div class="acciones">

          <!-- crear nuevo -->
          <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
            <img src="../../recursos/img/nueva.png">
            <span>Nuevo</span>
            <small>F2</small>
          </button>

          <!-- guardar -->
          <button type="submit" id="btnGuardar" title="Guardar" disabled>
            <img src="../../recursos/img/guardar.png">
            <span>Guardar</span>
            <small>F3</small>
          </button>

          <!-- eliminar -->
          <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
            <img src="../../recursos/img/limpiar.png">
            <span>Eliminar</span>
            <small>Del</small>
          </button>

          <!-- cancelar -->
          <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
            <img src="../../recursos/img/cancelar.png">
            <span>Cancelar</span>
            <small>F4</small>
          </button>

        </div>

      </form>

    </div>

    <!-- panel derecho con listado -->
    <div class="panel panel-lista">

      <!-- buscador -->
      <input
        type="text"
        id="buscador"
        placeholder=" Buscar categoría..."
        onkeyup="cargarCategorias()"
        class="buscador"
      >

      <!-- tabla categorías -->
      <div class="tabla-categorias">

        <!-- encabezado -->
        <div class="tabla-header">
          <span id="thId" class="th-orden">ID ▼</span>
          <span>Nombre</span>
          <span>Orden en pantalla</span>
        </div>

        <!-- cuerpo tabla -->
        <div id="listaCategorias" class="tabla-body"></div>

      </div>

    </div>

  </div>

  <!-- modal global para mensajes y confirmaciones -->
  <div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal-box">

      <!-- icono modal -->
      <div class="modal-icon" id="modalIcon">⚠️</div>

      <!-- título modal -->
      <h3 class="modal-title" id="modalTitulo">Título</h3>

      <!-- mensaje -->
      <p class="modal-text" id="modalMensaje">Mensaje</p>

      <!-- contenido extra opcional -->
      <div id="modalExtra" class="modal-text hidden"></div>

      <!-- botones modal -->
      <div class="modal-actions" id="modalActions">
        <button id="modalBtnCancel" class="btn-cancelar hidden">Cancelar</button>
        <button id="modalBtnOk" class="btn-aceptar">Aceptar</button>
        <button id="modalBtnDanger" class="btn-eliminar hidden">Eliminar</button>
      </div>

    </div>

  </div>

  <!-- script principal del módulo -->
  <script src="categorias.js"></script>

  <!-- mostrar nombre del módulo en título -->
  <script>
    const nombreModulo = document.title.split("|")[1]?.trim();
    if (nombreModulo) {
      document.getElementById("moduloTitulo").textContent = nombreModulo;
    }
  </script>

  <!-- función navegación volver -->
  <script>
    function volver() {
      const params = new URLSearchParams(window.location.search);
      const from = params.get("from");

      if (from === "producto") {
        window.location.href = "productos.html?refreshCategorias=1";
      } else {
        window.location.href = "../../home.html";
      }
    }
  </script>

</body>
</html>
