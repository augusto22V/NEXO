<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ALPX | Tipo Pedido</title>
  <link rel="stylesheet" href="../../compartido/css/base.css?v=2026.04.19.01" />
  <link rel="stylesheet" href="../../compartido/css/panelAuditoria.css?v=2026.04.19.01" />
  <link rel="stylesheet" href="tipo_pedido.css?v=2026.04.19.01" />
</head>
<body>
  <header class="topbar">
    <button class="btn-volver" onclick="volverSeguro()">← Volver</button>
    <div class="titulo">
      <span>Tipo Pedido</span>
    </div>
  </header>

  <main class="admin-container">
    <section class="panel panel-form">
      <h2>Tipo Pedido</h2>
      <form autocomplete="off" onsubmit="return false;">
        <input type="hidden" id="tipoPedidoId">

        <label>Codigo</label>
        <input type="text" id="codigoTipoPedido" class="input-id" readonly>

        <label>Nombre *</label>
        <input type="text" id="nombreTipoPedido" maxlength="120">

        <label>Descripcion</label>
        <input type="text" id="descripcionTipoPedido" maxlength="180">

        <div class="form-row">
          <label for="activoTipoPedido">Activo</label>
          <input type="checkbox" id="activoTipoPedido" checked>
        </div>
      </form>

      <panel-auditoria id="auditTipoPedido" data-tabla="tipo_pedido" data-id-input="tipoPedidoId"></panel-auditoria>

      <div class="acciones">
        <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
          <img src="../../recursos/img/nueva.png" />
          <span>Nuevo</span>
          <small>F2</small>
        </button>

        <button type="button" id="btnGuardar" onclick="guardar()" title="Guardar" disabled>
          <img src="../../recursos/img/guardar.png" />
          <span>Guardar</span>
          <small>F3</small>
        </button>

        <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
          <img src="../../recursos/img/limpiar.png" />
          <span>Eliminar</span>
          <small>Del</small>
        </button>

        <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
          <img src="../../recursos/img/cancelar.png" />
          <span>Cancelar</span>
          <small>F4</small>
        </button>
      </div>
    </section>

    <section class="panel panel-lista">
      <input
        type="text"
        id="buscar"
        placeholder="Buscar tipo pedido por codigo, nombre o descripcion..."
        class="buscador"
        autocomplete="off"
        onkeyup="filtrar()"
      />

      <div class="tabla-proveedores">
        <div class="tabla-header" style="grid-template-columns:90px 220px 1fr 120px;">
          <span id="thId" class="th-orden" title="Ordenar por ID">ID ▼</span>
          <span>Nombre</span>
          <span>Descripcion</span>
          <span>Estado</span>
        </div>

        <div id="tablaTipoPedido" class="tabla-body"></div>
      </div>
    </section>
  </main>

  <div id="modalAdvertencia" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h3 class="modal-title">Atencion</h3>
      <p class="modal-text" id="modalAdvertenciaTexto"></p>
      <div class="modal-actions center">
        <button class="btn-aceptar" onclick="cerrarAdvertencia(true)">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="../../compartido/js/baseModal.js?v=2026.04.19.01"></script>
  <script src="../../compartido/js/panelAuditoria.js?v=2026.04.19.01"></script>
  <script src="tipo_pedido.js?v=2026.04.19.01"></script>
  <script src="/compartido/js/seguridad.js?v=2026.04.19.01"></script>
</body>
</html>
