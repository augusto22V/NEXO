<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
  <title>LibreríaSys | Clientes</title>

<link rel="stylesheet" href="../../compartido/css/base.css">
<link rel="stylesheet" href="../../compartido/css/style.css">
<link rel="stylesheet" href="../../compartido/css/panelAuditoria.css">
<link rel="stylesheet" href="cliente.css">

</head>
<body>

<header class="topbar">
  <button class="btn-volver" onclick="volverSeguro()">← Volver</button>
<div class="titulo">
  <span id="moduloTitulo">Carga de Cliente</span>
</div>
</header>

<main class="cliente-layout">

  <!-- FORMULARIO -->
  <section class="panel form-panel">
    <h2>Cliente</h2>

    <input type="hidden" id="clienteId">

    <label>Código</label>
    <input type="text" id="codigoCliente">

    <label>Nombre completo</label>
    <input type="text" id="nombre">

    <label>Razón social</label>
    <input type="text" id="razon">

    <label>CI-RUC</label>
    <input type="text" id="ci-ruc">

    <label>Teléfono</label>
    <input type="text" id="telefono">

    <label>Dirección</label>
    <input type="text" id="direccion">

<label>Correo</label>
<input type="email" id="email" value="sincorreo@gmail.com">

    
    <panel-auditoria id="auditCliente" data-tabla="cliente" data-id-input="clienteId"></panel-auditoria>
    <div class="acciones">

  <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
    <img src="../../recursos/img/nueva.png">
    <span>Nuevo</span>
    <small>F2</small>
  </button>

<button type="button" id="btnGuardar" onclick="guardar()" title="Guardar" disabled>
    <img src="../../recursos/img/guardar.png">
    <span>Guardar</span>
    <small>F3</small>
  </button>

  <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
    <img src="../../recursos/img/limpiar.png">
    <span>Eliminar</span>
    <small>Del</small>
  </button>

  <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
    <img src="../../recursos/img/cancelar.png">
    <span>Cancelar</span>
    <small>F4</small>
  </button>

</div>


  </div> 


    
  </section>

  <!-- LISTA -->
<section class="panel lista-panel">
  <input type="text" id="buscar" placeholder="Buscar cliente..." onkeyup="filtrar()">

  <!-- DETALLE CLIENTE -->


  <div class="detalle-row vacio">
    Seleccione un cliente
  </div>


<p id="avisoTabla" class="aviso-tabla hidden">
  Finalice la carga o cancele para seleccionar otro cliente
</p>


<!-- TABLA -->
<div class="tabla-clientes">
  <div class="tabla-header">
    <span id="thId" class="th-orden" title="Ordenar por ID">ID ▼</span>
    <span>Nombre</span>
    <span>Razón social</span>
    <span>RUC</span>
    <span>Teléfono</span>
    <span>Dirección</span>
    <span>Correo</span>
  </div>

  <div id="tablaClientes" class="tabla-body"></div>
</div>

</section>

</main>

<!-- MODAL CONFIRMAR ELIMINACIÓN -->
<div id="modalEliminar" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Confirmar eliminación</h3>

    <p class="modal-text">
      ¿Desea eliminar el cliente?
    </p>

    <p class="modal-nombre" id="modalNombreCliente"></p>

    <div class="modal-actions">
      <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
      <button class="btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
    </div>
  </div>
</div>

<!-- MODAL ADVERTENCIA -->
<div id="modalAdvertencia" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Atención</h3>

    <p class="modal-text" id="modalAdvertenciaTexto"></p>

    <div class="modal-actions center">
      <button class="btn-aceptar" onclick="cerrarAdvertencia(true)">Aceptar</button>
    </div>
  </div>
</div>


<script src="../../compartido/js/baseModal.js"></script>
<script src="../../compartido/js/panelAuditoria.js"></script>
<script src="clientes.js"></script>
<script src="/compartido/js/seguridad.js"></script>

</body>
</html>
