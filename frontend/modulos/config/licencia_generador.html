<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #10141a; color: #fff; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .box { width: min(100%, 520px); background: #151c25; border: 1px solid #2f3a47; border-radius: 14px; padding: 16px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    .campo { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; color: #bfc7d4; font-size: 13px; }
    input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid #364456; background: #0f141c; color: #fff; padding: 0 12px; font-size: 16px; }
    button { width: 100%; height: 44px; border: 0; border-radius: 10px; background: #147696; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .out { margin-top: 14px; padding: 12px; border-radius: 10px; background: #0e131b; border: 1px solid #2e3a49; }
    .out-row { margin-bottom: 8px; }
    .out-row:last-child { margin-bottom: 0; }
    .out label { color: #93a4b9; margin-bottom: 4px; }
    .out input { font-weight: 700; letter-spacing: 0.06em; }
    .acciones { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .acciones button { background: #2b3746; }
    .acciones button#btnCopiar { background: #2e7d32; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Generador de Control</h1>

    <div class="campo">
      <label for="controlActual">Control Actual</label>
      <input id="controlActual" type="text" inputmode="numeric" maxlength="16" autocomplete="off">
    </div>

    <div class="campo">
      <label for="diasActivar">Dias a Activar</label>
      <input id="diasActivar" type="text" inputmode="numeric" maxlength="4" value="30" autocomplete="off">
    </div>

    <button id="btnGenerar" type="button">Generar</button>

    <div class="out">
      <div class="out-row">
        <label for="fechaSalida">Fecha Numerica</label>
        <input id="fechaSalida" type="text" readonly>
      </div>
      <div class="out-row">
        <label for="controlNuevo">Nuevo Control</label>
        <input id="controlNuevo" type="text" readonly>
      </div>
      <div class="acciones">
        <button id="btnLimpiar" type="button">Limpiar</button>
        <button id="btnCopiar" type="button">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    const SECRET_NUM = BigInt("73915482");

    const controlActualEl = document.getElementById("controlActual");
    const diasActivarEl = document.getElementById("diasActivar");
    const fechaSalidaEl = document.getElementById("fechaSalida");
    const controlNuevoEl = document.getElementById("controlNuevo");
    const btnGenerar = document.getElementById("btnGenerar");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const btnCopiar = document.getElementById("btnCopiar");

    function soloNumeros(v) {
      return String(v || "").replace(/\D/g, "");
    }

    function pad(v, len) {
      return String(v).padStart(len, "0");
    }

    function fechaNum(date) {
      const yyyy = date.getFullYear();
      const mm = pad(date.getMonth() + 1, 2);
      const dd = pad(date.getDate(), 2);
      return `${yyyy}${mm}${dd}`;
    }

    function firma(controlActual, fecha) {
      const control = BigInt(soloNumeros(controlActual) || "0");
      const fechaN = BigInt(soloNumeros(fecha) || "0");
      const mixed = (control * 97n + fechaN * 13n + SECRET_NUM * 31n) % 100000000n;
      return String(mixed).padStart(8, "0");
    }

    function generar() {
      const controlActual = soloNumeros(controlActualEl.value).slice(0, 16);
      const dias = Number(soloNumeros(diasActivarEl.value));

      if (!/^\d{16}$/.test(controlActual)) {
        alert("Control Actual invalido");
        return;
      }

      if (!Number.isFinite(dias) || dias <= 0) {
        alert("Dias invalidos");
        return;
      }

      const objetivo = new Date();
      objetivo.setHours(0, 0, 0, 0);
      objetivo.setDate(objetivo.getDate() + dias);

      const fecha = fechaNum(objetivo);
      const nuevoControl = `${fecha}${firma(controlActual, fecha)}`;

      fechaSalidaEl.value = fecha;
      controlNuevoEl.value = nuevoControl;
    }

    function limpiar() {
      controlActualEl.value = "";
      diasActivarEl.value = "30";
      fechaSalidaEl.value = "";
      controlNuevoEl.value = "";
      controlActualEl.focus();
    }

    function copiar() {
      const valor = controlNuevoEl.value.trim();
      if (!valor) return;
      navigator.clipboard.writeText(valor).catch(() => {
        controlNuevoEl.select();
        document.execCommand("copy");
      });
    }

    controlActualEl.addEventListener("input", () => {
      controlActualEl.value = soloNumeros(controlActualEl.value).slice(0, 16);
    });

    diasActivarEl.addEventListener("input", () => {
      diasActivarEl.value = soloNumeros(diasActivarEl.value).slice(0, 4);
    });

    btnGenerar.addEventListener("click", generar);
    btnLimpiar.addEventListener("click", limpiar);
    btnCopiar.addEventListener("click", copiar);
  </script>
</body>
</html>
