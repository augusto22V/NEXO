<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
  <title>LibreríaSys | Vendedor </title>

  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="../../compartido/css/panelAuditoria.css">
  <link rel="stylesheet" href="vendedor.css">
</head>
<body>

<header class="topbar">
<button class="btn-volver" onclick="volverSeguro()">← Volver</button>

  <div class="titulo">
    <span id="moduloTitulo">Carga de Vendedor</span>
  </div>
</header>

<main class="cliente-layout">

  <!-- ===== FORMULARIO ===== -->
  <section class="panel form-panel">
    <h2>Vendedor</h2>

    <input type="hidden" id="vendedorId">

        <label>Código</label>
      <input type="text" id="codigoVendedor" inputmode="numeric" autocomplete="off">

      <label>Nombre</label>
      <input type="text" id="nombre">

      <label class="check-row">
        <input type="checkbox" id="activo">
        <span>Vendedor activo</span>
     </label>

      <section class="comision-card">
        <h3>COMISIÓN</h3>

        <label>Tipo de cálculo</label>
        <select id="tipoCalculoComision">
          <option value="productos">Productos</option>
          <option value="servicios">Servicios</option>
          <option value="ambos">Ambos</option>
        </select>

        <label>Tipo de comisión</label>
        <select id="tipoComision">
          <option value="total_bruto">Total Bruto</option>
          <option value="total_neto">Total Neto</option>
          <option value="cantidad">Cantidad</option>
        </select>

        <div id="grupoComisionVentas" class="comision-field-group">
          <label>% Comisión Ventas</label>
          <input type="number" id="porcentajeVentas" min="0" step="0.01">
        </div>

        <div id="grupoComisionServicios" class="comision-field-group">
          <label>% Comisión Servicios</label>
          <input type="number" id="porcentajeServicios" min="0" step="0.01">
        </div>
      </section>

    <panel-auditoria id="auditVendedor" data-tabla="vendedor" data-id-input="vendedorId"></panel-auditoria>
    <div class="acciones">

      <button type="button" id="btnNuevo" onclick="nuevo()" title="Nuevo">
        <img src="../../recursos/img/nueva.png">
        <span>Nuevo</span>
        <small>F2</small>
      </button>

      <button type="button" id="btnGuardar" onclick="guardar()" title="Guardar" disabled>
        <img src="../../recursos/img/guardar.png">
        <span>Guardar</span>
        <small>F3</small>
      </button>

      <button type="button" id="btnEliminar" onclick="eliminar()" title="Eliminar" disabled>
        <img src="../../recursos/img/limpiar.png">
        <span>Eliminar</span>
        <small>Del</small>
      </button>

      <button type="button" id="btnCancelar" onclick="cancelar()" title="Cancelar" disabled>
        <img src="../../recursos/img/cancelar.png">
        <span>Cancelar</span>
        <small>F4</small>
      </button>

    </div>

  </section>

  <!-- ===== LISTA ===== -->
  <section class="panel lista-panel">

    <input type="text" 
           id="buscarVendedor" 
           placeholder="Buscar vendedor..."
           onkeyup="filtrar()">

    <div class="detalle-row vacio">
      Seleccione un vendedor
    </div>

    <p id="avisoTabla" class="aviso-tabla hidden">
      Finalice la carga o cancele para seleccionar otro vendedor
    </p>

    <div class="tabla-clientes">

      <div class="tabla-header">
        <span id="thId">ID ▼</span>
        <span>Nombre</span>
      </div>

      <div id="tablaVendedores" class="tabla-body"></div>

    </div>

  </section>

</main>

<!-- ===== MODAL CONFIRMAR ELIMINACIÓN ===== -->
<div id="modalEliminar" class="modal-overlay hidden">
  <div class="modal-box">

    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Confirmar eliminación</h3>

    <p class="modal-text">
      ¿Desea eliminar el vendedor?
    </p>

    <p class="modal-nombre" id="modalNombreVendedor"></p>

    <div class="modal-actions">
    <button class="btn-cancelar" type="button">Cancelar</button>
    <button class="btn-eliminar" type="button">Eliminar</button>
    </div>

  </div>
</div>

<!-- ===== MODAL ADVERTENCIA ===== -->
<div id="modalAdvertencia" class="modal-overlay hidden">
  <div class="modal-box">

    <div class="modal-icon">⚠️</div>

    <h3 class="modal-title">Atención</h3>

    <p class="modal-text" id="modalAdvertenciaTexto"></p>

    <div class="modal-actions center">
      <button class="btn-aceptar" type="button">Aceptar</button>
    </div>

  </div>
</div>

<script src="../../compartido/js/baseModal.js"></script>
<script src="../../compartido/js/panelAuditoria.js"></script>
<script src="vendedor.js"></script>
<script src="/compartido/js/seguridad.js"></script>

</body>
</html>
