<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>LibreríaSys | Cobro</title>
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="./caja.css?v=2026.05.08.07">
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="btn-cancelar" onclick="window.close()">&#8592; Cancelar</button>
    <div class="titulo"><span>Cobro</span></div>
    <div class="topbar-info"><span id="cajaFecha"></span></div>
  </div>

  <!-- BODY PRINCIPAL -->
  <div class="cobro-body">

    <!-- IZQUIERDA: cliente + items -->
    <div class="cobro-izq">

      <!-- RUC / CLIENTE -->
      <div class="cliente-row">
        <div class="cliente-field cliente-ruc">
          <label>RUC</label>
          <input type="text" id="rucInput" placeholder="RUC o Cédula"
                 onkeydown="buscarClientePorRuc(event)">
        </div>
        <div class="cliente-field cliente-nombre">
          <label>Cliente</label>
          <input type="text" id="clienteNombre" placeholder="Nombre del cliente" readonly>
        </div>
        <button class="btn-cliente-clear" onclick="limpiarCliente()" title="Limpiar">×</button>
      </div>

      <!-- ITEMS -->
      <div class="items-header">
        Ítems (<span id="cantItems">0</span>)
      </div>
      <div class="items-scroll">
        <div id="itemsBody">
          <div class="items-vacio">Cargando...</div>
        </div>
      </div>

    </div>

    <!-- DERECHA: totales + pago -->
    <div class="cobro-der">

      <!-- TOTALES CARD -->
      <div class="totales-card">
        <div class="totales-row">
          <span class="totales-label">Total</span>
          <div class="totales-montos">
            <span class="tm-gs"><span class="tm-flag">&#x1F1F5;&#x1F1FE;</span><span id="totalHeaderGs">0</span></span>
            <span class="tm-brl"><span class="tm-flag">&#x1F1E7;&#x1F1F7;</span><span id="totalHeaderBrl">0,00</span></span>
            <span class="tm-usd"><span class="tm-flag">&#x1F1FA;&#x1F1F8;</span><span id="totalHeaderUsd">0,00</span></span>
          </div>
        </div>
        <div class="totales-row totales-apagar" id="filaPagar">
          <span class="totales-label">A pagar</span>
          <div class="totales-montos">
            <span class="tm-gs"><span class="tm-flag">&#x1F1F5;&#x1F1FE;</span><span id="aPagarGs">0</span></span>
            <span class="tm-brl"><span class="tm-flag">&#x1F1E7;&#x1F1F7;</span><span id="aPagarBrl">0,00</span></span>
            <span class="tm-usd"><span class="tm-flag">&#x1F1FA;&#x1F1F8;</span><span id="aPagarUsd">0,00</span></span>
          </div>
        </div>
      </div>

      <!-- INGRESO DE PAGO -->
      <div class="pago-input-row">
        <select id="metodoPagoSel" class="pago-select">
          <option value="EFECTIVO">EFECTIVO</option>
          <option value="TARJETA">TARJETA</option>
          <option value="TRANSFERENCIA">TRANSFERENCIA</option>
        </select>
        <select id="monedaSel" class="pago-select">
          <option value="PYG">GUARANÍ</option>
          <option value="BRL">REAL</option>
          <option value="USD">DÓLAR</option>
        </select>
        <input type="number" id="montoInput" class="pago-monto-input"
               placeholder="0" min="0" step="any"
               onkeydown="if(event.key==='Enter') agregarPago()">
        <button class="btn-agregar-pago" onclick="agregarPago()">+</button>
      </div>

      <!-- TABLA DE PAGOS -->
      <div class="pagos-tabla-wrap">
        <table class="pagos-tabla">
          <thead>
            <tr>
              <th>Vuelto</th>
              <th>Cobro</th>
              <th>Moneda</th>
              <th>Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pagosBody">
            <tr class="pagos-vacio-row">
              <td colspan="5">Lista vacía</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="cobro-footer">
    <button class="btn-sin-ticket" onclick="efectivizar(false)">Sin ticket</button>
    <button class="btn-finalizar" id="btnFinalizar" onclick="efectivizar(true)">Finalizar</button>
  </div>

  <!-- SPINNER -->
  <div id="spinnerOverlay" class="spinner-overlay hidden">
    <div class="spinner-box">
      <div class="spinner"></div>
      <span id="spinnerTexto">Procesando...</span>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/compartido/js/app.config.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/session.manager.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/cache.bootstrap.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/seguridad.js?v=2026.04.17.03"></script>
  <script src="caja.js?v=2026.05.08.07"></script>

</body>
</html>
