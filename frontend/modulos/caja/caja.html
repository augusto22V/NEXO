<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
  <title>LibreríaSys | Caja</title>
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="./caja.css">
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <button class="btn-cancelar">
       Cancelar
    </button>

    <div class="titulo">
      <span>Caja</span>
    </div>

    <div class="topbar-info">
      <span id="cajaFecha"></span>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="caja-container">

    <div class="caja-simple">

      <!-- BUSCAR VENTA -->
      <div class="busqueda-row">
        
       <input type="text" id="nroVenta" readonly>
        <button onclick="buscarVentaPorCodigoTop()">Buscar</button>
      </div>

      <!-- LISTA PRODUCTOS -->
      <div class="productos-box">
        <div id="carritoBody">
          <div class="carrito-vacio">
            Ingresá un número de venta
          </div>
        </div>
      </div>

            <!-- MÉTODOS DE PAGO -->
      <div class="metodos-pago">
        <button class="metodo activo" data-metodo="efectivo">💵 Efectivo</button>
        <button class="metodo" data-metodo="debito">💳 Débito</button>
        <button class="metodo" data-metodo="credito">💳 Crédito</button>
        <button class="metodo" data-metodo="qr">📷 QR</button>
        <button class="metodo" data-metodo="pix">🔷 PIX</button>
        <button class="metodo" data-metodo="transferencia">🏦 Transfer.</button>
      </div>

      <!-- TOTAL -->
<!-- TOTAL BASE -->
<div class="total-base">
  Total Base (Gs):
  <span id="totalBase">0</span>
</div>

<!-- TABLA MONEDAS -->
<div class="tabla-monedas">

  <div class="columna">
    <div class="titulo-moneda">Guaraní (Gs)</div>
    <div>Total: <span id="totalGs">0</span></div>
    <input type="number" id="pagoGs" placeholder="Recibido" oninput="calcularColumnas()">
    <div>Vuelto: <span id="vueltoGs">0</span></div>
  </div>

  <div class="columna">
    <div class="titulo-moneda">Real (R$)</div>
    <div>Total: <span id="totalBrl">0</span></div>
    <input type="number" id="pagoBrl" placeholder="Recibido" oninput="calcularColumnas()">
    <div>Vuelto: <span id="vueltoBrl">0</span></div>
  </div>

  <div class="columna">
    <div class="titulo-moneda">Dólar (US$)</div>
    <div>Total: <span id="totalUsd">0</span></div>
    <input type="number" id="pagoUsd" placeholder="Recibido" oninput="calcularColumnas()">
    <div>Vuelto: <span id="vueltoUsd">0</span></div>
  </div>

</div>

<button class="btn-confirmar" onclick="efectivizar()">
  Confirmar
</button>

    </div>

  </div>

  <!-- SPINNER -->
  <div id="spinnerOverlay" class="spinner-overlay hidden">
    <div class="spinner-box">
      <div class="spinner"></div>
      <span id="spinnerTexto">Procesando...</span>
    </div>
  </div>


  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/compartido/js/app.config.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/session.manager.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/cache.bootstrap.js?v=2026.04.17.03"></script>
  <script src="/compartido/js/seguridad.js?v=2026.04.17.03"></script>
  <script src="caja.js"></script>

</body>
</html>
