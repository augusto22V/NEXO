<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar Movimientos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="movimientos.css">
</head>
<body>

<header class="topbar">
  <button class="btn-volver" onclick="volverVenta()">←</button>
  <div class="top-title">
    <h1>Buscar movimientos</h1>
    <small>Filtro avanzado</small>
  </div>
</header>

<section class="mov-container">

  <!-- ================= FILTROS ================= -->
  <div class="mov-filtros-grid">

    <div class="field">
      <label>Fecha desde</label>
      <input type="date" id="movFechaDesde">
    </div>

    <div class="field">
      <label>Fecha hasta</label>
      <input type="date" id="movFechaHasta">
    </div>

    <div class="field">
      <label>Cliente</label>
      <div class="mov-cliente-row">
        <input id="movClienteCod" type="text" placeholder="001">
        <input id="movClienteNom" type="text" placeholder="Nombre cliente" disabled>
       <button class="btn-icon" onclick="abrirBuscadorCliente()">
  <img src="../../recursos/img/buscar.png" style="width:18px">
</button>

      </div>
    </div>

    <!-- Estado + Botones en la misma fila -->
    <div class="field mov-estado-actions">
      <label>Estado</label>

      <div class="mov-estado-row">
        <select id="movEstado">
          <option value="">Todos</option>
          <option value="ABIERTO">Abierto</option>
          <option value="EFECTIVADO">Efectivado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>

        <div class="mov-btns-inline">

          <div class="btn-img" role="button" tabindex="0" onclick="filtrarMovimientos()">
            <img src="../../recursos/img/buscar.png" alt="Buscar">
            <span>Buscar</span>
          </div>

          <div class="btn-img" role="button" tabindex="0" onclick="limpiarFiltrosMov()">
            <img src="../../recursos/img/limpiar.png" alt="Limpiar">
            <span>Limpiar</span>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- ================= TABLA MOVIMIENTOS ================= -->
  <div class="mov-tabla">

    <div class="mov-head">
      <div></div>
      <div>ID</div>
      <div>Fecha</div>
      <div>Cliente</div>
      <div>Estado</div>
      <div>Total</div>
    </div>

    <div id="movBody" class="mov-body"></div>

  </div>

  <!-- ================= DETALLE (PRODUCTOS) ================= -->
  <div class="mov-detalle">

    <div class="mov-detalle-head">
      <h3>Detalle de productos</h3>
      <small id="movDetalleInfo">Seleccione un movimiento para ver sus productos.</small>
    </div>

    <div class="mov-detalle-tabla">
      <div class="mov-detalle-cols">
        <div>Producto</div>
        <div>Cant.</div>
        <div>P. Unit.</div>
        <div>Subtotal</div>
      </div>

      <div id="movDetalleBody" class="mov-detalle-body">
        <div class="mov-detalle-vacio">Sin detalle</div>
      </div>
    </div>

  </div>

</section>

<script src="movimientos.js"></script>

<script>
  function volverVenta(){
    window.location.href = "../venta/venta.html";
  }
</script>

</body>
</html>
