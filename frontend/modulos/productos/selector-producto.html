<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Andy Closet | Seleccionar Producto</title>

  <link rel="stylesheet" href="../../compartido/css/base.css">
  <link rel="stylesheet" href="productos.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="btn-volver" onclick="volver()">← Volver</button>
  <div class="titulo">
    <h1>Andy Closet</h1>
    <span>Seleccionar Producto</span>
  </div>
</div>

<div class="admin-container" style="grid-template-columns: 1fr;">

  <!-- LISTADO -->
  <div class="panel panel-lista">

    <input
      type="text"
      id="buscadorProductos"
      placeholder="🔍 Buscar producto..."
      class="buscador"
    >

    <div id="listaProductos" class="lista"></div>

  </div>

</div>

<script src="selector-producto.js"></script>
</body>
</html>
