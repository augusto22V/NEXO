<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Stop Top | Inicio</title>

  <link rel="stylesheet" href="compartido/css/base.css">
  <link rel="stylesheet" href="compartido/css/home.css">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- HEADER -->
  <header class="home-header">
    <h1>Stop Top</h1>
    <span>Sistema de Ventas</span>
  </header>

  <!-- MENU -->
  <main class="dashboard">

    <div class="card" onclick="ir('modulos/venta/venta.html')">
      <i class="fa-solid fa-cart-shopping"></i>
      <h3>Venta</h3>
      <p>Registrar venta</p>
    </div>

   <div class="card" onclick="ir('modulos/compra/compra.html')">
      <i class="fa-solid fa-basket-shopping"></i>
      <h3>Compra</h3>
  </div>

    <div class="card" onclick="ir('modulos/venta/venta.html?rapida=true')">
      <i class="fa-solid fa-bolt"></i>
         <h3>Venta Rápida</h3>
         <p>Cobro rápido</p>
  </div>

     <div class="card" onclick="ir('modulos/proveedores/proveedores.html?rapida=true')">
         <i class="fa-solid fa-handshake"></i>
        <h3>Proveedores</h3>
    </div>

    <div class="card" onclick="ir('modulos/productos/productos.html')">
      <i class="fa-solid fa-box"></i>
      <h3>Productos</h3>
      <p>Administrar</p>
    </div>

    <div class="card" onclick="location.href='modulos/cliente/cliente.html'">
      <i class="fas fa-user"></i>
      <h3>Clientes</h3>
      <p>Registrar clientes</p>
    </div>

    <div class="card" onclick="ir('modulos/categorias/categorias.html')">
      <i class="fa-solid fa-tags"></i>
      <h3>Categorías</h3>
      <p>Clasificación</p>
    </div>

    <div class="card" onclick="ir('modulos/sorteo/sorteo.html')">
      <i class="fa-solid fa-gift"></i>
      <h3>Sorteo</h3>
      <p>Promociones</p>
    </div>

  </main>

  <script src="compartido/js/home.js"></script>

</body>
</html>
