# Ayuda extra para mantener despierto el catalogo en Render (el plan gratis se duerme a los 15 minutos
# sin visitas). GitHub no garantiza el horario de estas corridas: el aviso principal lo da la PC
# (scripts/sincronizar_catalogo.js cada 10 minutos). Solo consulta /api/health: no toca la base.
name: Catalogo despierto

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Despertar el catalogo
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://libreria-sys.onrender.com/api/health
