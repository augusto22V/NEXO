# Configuracion para publicar la app gratis en Render (https://render.com).
# La base de datos va en Neon (https://neon.tech), tambien gratis.
# Pasos completos en PUBLICAR_EN_LA_NUBE.md
services:
  - type: web
    name: libreria-sys
    runtime: node
    plan: free
    rootDir: backend
    # Sin esto Render solo se actualiza cuando cambia algo en backend/,
    # y los cambios del catalogo (que estan en frontend/) no se publicaban solos.
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - frontend/**
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false          # se pega a mano: la direccion de la base de Neon
      - key: JWT_SECRET
        generateValue: true  # Render inventa una clave segura
      - key: CATALOGO_SOLO
        value: "true"        # en internet corre solo el catalogo; el sistema completo sigue en la PC
      - key: CATALOGO_WHATSAPP
        value: "595986210051" # WhatsApp que recibe los pedidos si no hay otro cargado en el catalogo
